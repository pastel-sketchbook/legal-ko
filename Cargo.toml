[workspace]
members = ["crates/core", "crates/tui", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.6.6"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
futures = "0.3.33"
indicatif = "0.18.6"
rayon = "1.12.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
libc = "0.2.189"
meilisearch-sdk = "0.33.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json"] }
rodio = "0.22.2"
rusqlite = { version = "0.40.1", features = ["bundled", "vtab"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
vibe-rust = { path = "../../voice/vibe-rust" }

# PDF (Typst-based generation)
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
fontdb = "0.24.0"
time = "0.3.55"

[profile.release]
lto = true
strip = true
